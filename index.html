const NAMES=[["Luna_Curiosa","#b794ff"],["Dex_Zoeira","#ff9a5c"],["Bia_Hype","#4fe3b0"],["Prof_Fatos","#6ec1ff"],["Zen_Filosofo","#a0e06a"],["Capitao_Desafio","#ff6b81"],["Plantao_News","#ffd166"],["Tio_Nostalgia","#d29bff"]];
const FILL=["kkkk","kkkkkk","boa","mds","f","nice","eita","verdade","pqp","lindo","tmj","isso aí","sdds","kkkkkkk","hmm","aff","po","sério","real"];
const CATS=[["atual","🔥 Rolando agora"],["jogos","🎮 Jogos"],["comida","🍕 Comida"],["nostalgia","📼 Nostalgia"],["vida","🎙️ Papo de live"]];
const PACES={calmo:[55,100],normal:[25,55],agitado:[10,25]};
const $=id=>document.getElementById(id);
const KEY='chatpriv_v6';
let used=new Set(),pace='normal',enabled=new Set(NAMES.map((_,i)=>i)),catOn=new Set(CATS.map(c=>c[0])),vibrate=true,awake=true,paused=false,started=false,timer=null,lastP=-1,wl=null;
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');used=new Set(s.used||[]);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({used:[...used]}));}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a);
function mmdd(){const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
const fresh=s=>{const t=mmdd();return t>=(s.a||'0000')&&t<=(s.b||'9999');};
function pickScene(){
  let pool=SC.map((s,i)=>[s,i]).filter(([s,i])=>catOn.has(s.c)&&fresh(s)&&!used.has(i));
  if(!pool.length){SC.forEach((s,i)=>used.delete(i));pool=SC.map((s,i)=>[s,i]).filter(([s])=>catOn.has(s.c)&&fresh(s));}
  if(!pool.length)return null;
  const [s,i]=pool[Math.floor(Math.random()*pool.length)];used.add(i);save();return s;
}
function pickP(){
  const e=[...enabled];let p;let g=0;
  do{p=e[Math.floor(Math.random()*e.length)];}while(e.length>1&&p===lastP&&++g<20);
  lastP=p;return p;
}
function addMsg(p,text){
  const f=$('feed'),d=document.createElement('div');d.className='m';
  d.style.setProperty('--c',NAMES[p][1]);
  const b=document.createElement('b');b.textContent=NAMES[p][0];d.appendChild(b);d.appendChild(document.createTextNode(text));
  f.appendChild(d);
  const all=[...f.children];while(all.length>7)f.removeChild(all.shift());
  const n=f.children.length;[...f.children].forEach((c,i)=>{c.classList.toggle('old',i===n-3);c.classList.toggle('older',i<n-3);});
}
function delay(t){return Math.max(1100,Math.min(5500,500+t.length*95))+rnd(0,1400);}
function play(){
  clearTimeout(timer);if(!started||paused)return;
  const s=pickScene();if(!s){timer=setTimeout(play,5000);return;}
  const lines=s.l.slice();
  if(Math.random()<.5&&lines.length>2){lines.splice(2+Math.floor(Math.random()*(lines.length-2)),0,FILL[Math.floor(Math.random()*FILL.length)]);}
  let i=0;
  (function step(){
    if(paused||!started)return;
    addMsg(pickP(),lines[i]);
    if(i===0&&vibrate){try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}}
    i++;
    if(i<lines.length){timer=setTimeout(step,delay(lines[i]));}
    else{const [a,b]=PACES[pace];timer=setTimeout(play,rnd(a,b)*1000);}
  })();
}
async function lock(){try{if(awake&&'wakeLock' in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function chip(parent,label,on,fn){const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=()=>fn(b);parent.appendChild(b);return b;}
const pb=Object.keys(PACES).map(k=>({k,b:chip($('paceC'),{calmo:'😌 Calmo',normal:'💬 Normal',agitado:'⚡ Agitado'}[k],k===pace,()=>{pace=k;pb.forEach(x=>x.b.classList.toggle('on',x.k===k));})}));
NAMES.forEach((n,i)=>chip($('pC'),n[0].split('_')[0],true,b=>{if(enabled.has(i)){if(enabled.size===1)return;enabled.delete(i);b.classList.add('off');b.classList.remove('on');}else{enabled.add(i);b.classList.remove('off');b.classList.add('on');}}));
CATS.forEach(([id,l])=>chip($('cC'),l,true,b=>{if(catOn.has(id)){if(catOn.size===1)return;catOn.delete(id);b.classList.add('off');b.classList.remove('on');}else{catOn.add(id);b.classList.remove('off');b.classList.add('on');}}));

// ===== IA: ouve sua voz e responde como chat =====
const AIKEY='chatpriv_ai_v1';
const DEF={gemini:'gemini-3.1-flash-lite',claude:'claude-haiku-5-5'};
let ai={on:false,prov:'gemini',key:'',ctx:'',model:''},heard='',sent=0,busy=false,lastCall=0,rec=null,recOn=false,recent=[];

const aiMsg=t=>{$('aiSt').textContent=t;};
const GAP={calmo:14,normal:8,agitado:5};
let retryT=null;
function sysPrompt(){
  const names=[...enabled].map(i=>NAMES[i][0]).join(', ');
  return `Você simula o chat de uma live da Twitch brasileira, em pt-BR, que SÓ o streamer vê (é um chat de companhia declarado, não finge ser audiência real). Escreva mensagens como espectadores reais:
- mensagens MUITO curtas: mediana 2 a 3 palavras, quase nunca mais de 8; metade das vezes 1 a 3 palavras
- minúsculas, SEM ponto final, gíria: kkkk, mds, pqp, mano, cara, vc, q, pq, tmj, sdds, eita, boa, f, nice, gg, lindo
- ~15% risada (kkkk), às vezes letra esticada (aaaa, loooongo), no máximo 1 pergunta a cada 8 mensagens
- reaja ao que o streamer DISSE: concorde, tire sarro, lembre de algo, comente o jogo, o assunto, comida, nostalgia
- varie os usuários; um pode responder o outro; nada de frases de efeito, constatação filosófica nem texto longo
- nunca repita o que já foi dito no chat recente
Usuários disponíveis: ${names}.
Contexto da live: ${ai.ctx||'(não informado)'}.
Responda APENAS um array JSON, de 3 a 6 itens: [{"u":"Nome_Do_Usuario","t":"mensagem"}]`;
}
let q=[],pumping=false,lastShow=0,lastGap=0,firstOfBatch=true,interimTxt='',skipChars=0,dT=null;
function extract(buf,from){const out=[],re=/\{[^{}]*\}/g;re.lastIndex=from;let m,last=from;
  while((m=re.exec(buf))){try{const o=JSON.parse(m[0]);if(o&&o.t)out.push(o);last=re.lastIndex;}catch(e){}}return [out,last];}
function schedScript(){clearTimeout(timer);const [a,b]=PACES[pace];timer=setTimeout(play,rnd(a,b)*1000+20000);}   // roteiro só volta se você ficar calado
function enqueue(m){q.push(m);pump();}
function pump(){
  if(pumping||!q.length)return;pumping=true;
  const m=q[0],w=Math.max(0,lastGap-(Date.now()-lastShow));
  setTimeout(()=>{
    pumping=false;if(paused||!started)return;
    q.shift();
    let p=NAMES.findIndex(n=>n[0]===m.u);if(p<0||!enabled.has(p))p=pickP();else lastP=p;
    const t=String(m.t).trim().replace(/[.]+$/,'');addMsg(p,t);recent.push(NAMES[p][0]+': '+t);if(recent.length>30)recent.shift();
    if(firstOfBatch&&vibrate){try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}}firstOfBatch=false;
    lastShow=Date.now();lastGap=Math.min(1700,350+t.length*42)+rnd(0,300);
    schedScript();pump();
  },w);
}
function geminiBody(model,user,think){
  const g={temperature:1,maxOutputTokens:260,responseMimeType:'application/json'};
  if(think){if(/gemini-3/.test(model))g.thinkingConfig={thinkingLevel:'minimal'};else if(/2\.5/.test(model))g.thinkingConfig={thinkingBudget:0};}
  return JSON.stringify({systemInstruction:{parts:[{text:sysPrompt()}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:g});
}
async function geminiStream(model,user){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse';
  let r,think=true;
  for(let t=0;t<3;t++){
    r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':ai.key},body:geminiBody(model,user,think)});
    if(r.ok)break;
    if(r.status===400&&think){think=false;continue;}                 // modelo não aceita o parâmetro de raciocínio: tenta sem
    if(r.status===503||r.status===500){await new Promise(x=>setTimeout(x,600));continue;}   // Gemini sobrecarregado: tenta de novo rápido
    break;
  }
  if(!r.ok)throw new Error('HTTP '+r.status+(r.status===429?' limite gratuito':r.status===404?' modelo não existe':r.status===503?' Gemini sobrecarregado':r.status===400||r.status===403?' chave/modelo':''));
  const rd=r.body.getReader(),dec=new TextDecoder();let sb='',acc='',idx=0,n=0;
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    sb+=dec.decode(value,{stream:true});let k;
    while((k=sb.indexOf('\n'))>=0){const line=sb.slice(0,k).trim();sb=sb.slice(k+1);
      if(!line.startsWith('data:'))continue;
      try{const j=JSON.parse(line.slice(5));acc+=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');}catch(e){}}
    const [o,l]=extract(acc,idx);idx=l;
    for(const x of o){if(n<6){n++;enqueue(x);}}      // cada mensagem aparece assim que o JSON dela fecha, sem esperar a resposta toda
  }
  return n;
}
async function aiTurn(){
  if(!ai.on||busy||!ai.key)return;
  const text=(heard.slice(sent)+' '+interimTxt).trim();
  if(text.length<10)return;
  const wait=GAP[pace]*1000-(Date.now()-lastCall);
  if(wait>0){clearTimeout(retryT);retryT=setTimeout(aiTurn,wait+50);return;}
  busy=true;lastCall=Date.now();sent=heard.length;skipChars=interimTxt.length;interimTxt='';
  clearTimeout(timer);firstOfBatch=true;aiMsg('IA pensando…');$('st').textContent='💭 pensando…';
  if(Math.random()<.6)enqueue({u:'',t:FILL[Math.floor(Math.random()*FILL.length)]});   // reação instantânea enquanto a IA pensa
  try{
    const user='Chat recente:\n'+(recent.slice(-10).join('\n')||'(vazio)')+'\n\nO streamer acabou de falar: "'+text.slice(-400)+'"';
    const model=ai.model||DEF[ai.prov];let n=0;
    if(ai.prov==='gemini')n=await geminiStream(model,user);
    else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model,max_tokens:300,system:sysPrompt(),messages:[{role:'user',content:user}]})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();const raw=(j.content&&j.content[0]&&j.content[0].text)||'';
      const [o]=extract(raw,0);o.slice(0,6).forEach(x=>{n++;enqueue(x);});
    }
    if(!n)throw new Error('resposta vazia');
    aiMsg('IA ligada · ouvindo');$('st').textContent='🎤 ouvindo';
  }catch(e){aiMsg('Erro da IA ('+e.message+'). Usando o roteiro.');$('st').textContent='⚠ IA falhou: '+e.message;schedScript();}
  busy=false;
}
function startMic(){
  const seguro=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!seguro)aiMsg('⚠ Página sem https: o Chrome vai pedir o microfone várias vezes. Hospede em https (ex.: GitHub Pages) pra pedir só uma vez.');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){aiMsg('Este navegador não tem reconhecimento de voz (use Chrome).');return false;}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let it='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i],t=r[0].transcript;
      if(r.isFinal){heard+=' '+(skipChars?t.slice(Math.min(skipChars,t.length)):t);skipChars=0;}else it+=t;}
    interimTxt=it;clearTimeout(dT);dT=setTimeout(aiTurn,550);   // dispara 0,5s depois da última palavra, sem esperar o Chrome fechar a frase
  };
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){recOn=false;aiMsg('Microfone bloqueado. Abra o arquivo por https ou localhost e permita o microfone.');}};
  rec.onend=()=>{if(recOn&&ai.on){setTimeout(()=>{try{rec.start();}catch(e){}},150);}};
  recOn=true;try{rec.start();}catch(e){}$('st').textContent='🎤 ouvindo';return true;
}
function setAi(on){
  if(on&&!ai.key){aiMsg('Cole a chave da API primeiro.');return false;}
  ai.on=on;
  if(on){if(!startMic()){ai.on=false;return false;}if(location.protocol==='https:'||location.hostname==='localhost')aiMsg('IA ligada · ouvindo');}
  else{recOn=false;try{rec&&rec.stop();}catch(e){}aiMsg('IA desligada: usando só o roteiro.');}
  return ai.on;
}
let aiBtn=null;
function bindAi(){
  $('key').value=ai.key;$('ctx').value=ai.ctx;$('model').value=ai.model;
  $('model').oninput=()=>{ai.model=$('model').value.trim();saveAi();};
  const pv=[['gemini','🆓 Gemini (grátis)'],['claude','Claude (pago)']].map(([k,l])=>({k,b:chip($('provC'),l,k===ai.prov,()=>{ai.prov=k;ai.model='';$('model').value='';$('model').placeholder='modelo (padrão: '+DEF[k]+')';pv.forEach(x=>x.b.classList.toggle('on',x.k===k));saveAi();})}));
  $('model').placeholder='modelo (padrão: '+DEF[ai.prov]+')';
  $('key').oninput=()=>{ai.key=$('key').value.trim();saveAi();};
  $('ctx').oninput=()=>{ai.ctx=$('ctx').value.trim();saveAi();};
  aiBtn=chip($('aiC'),'🤖 Ligar IA',false,b=>{const on=setAi(!ai.on);b.classList.toggle('on',on);b.textContent=on?'🤖 IA ligada':'🤖 Ligar IA';});
}
bindAi();
$('go').onclick=()=>{started=true;$('start').style.display='none';lock();play();};
$('skip').onclick=()=>{clearTimeout(timer);play();};
$('pp').onclick=()=>{paused=!paused;$('pp').textContent=paused?'▶':'⏸';paused?clearTimeout(timer):play();};
$('gear').onclick=()=>{$('sheet').hidden=false;};
$('close').onclick=()=>{$('sheet').hidden=true;};
document.addEventListener('visibilitychange',()=>{if(started&&document.visibilityState==='visible')lock();});
</script></body></html>
